<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHB Activity Dashboard</title>

<link rel="stylesheet" href="css/style.css">

<style>
.header{
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
width:80px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:rgba(255,255,255,.05);
border-radius:20px;
padding:20px;
}

.points{
font-size:40px;
font-weight:bold;
}
</style>

</head>
<body>

<div class="header">

<div>
<img src="assets/logo.png" class="logo">
</div>

<div>
👤 User
</div>

</div>

<div class="grid">

<div class="card">
<h3>คะแนนสะสม</h3>
<div class="points">0</div>
</div>

<div class="card">
<h3>อันดับ</h3>
<div class="points">#0</div>
</div>

<div class="card">
<h3>กิจกรรมที่เข้าร่วม</h3>
<div class="points">0</div>
</div>

</div>

</body>
</html>
